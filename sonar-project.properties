# Chave da organização no SonarCloud
sonar.organization=beaexpertlda

# Chave única do projeto
sonar.projectKey=node-vulnerable-app
sonar.projectName=Node.js Vulnerable App SonarCloud

# URL obrigatório para a versão em nuvem
