name: SonarCloud Vulnerability Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    types: [ opened, synchronize, reopened ]

jobs:
  build:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Disable shallow clones for accurate analysis history

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: 556b59d827864a22205a6aa06d6251976daad6d6
        with:
          args: >
            -Dsonar.projectKey=beaexpertlda-key
            -Dsonar.sources=server.js
            -Dsonar.qualitygate.wait=true


